[package]
name = "aethermix"
version = "0.5.0"
edition = "2021"

[dependencies]
qtbridge = "0.3"
cpal = "0.18"
symphonia = { version = "0.5", features = ["all"] }
serde_json = "1"
librespot-core = "0.8"
librespot-playback = { version = "0.8", default-features = false }
librespot-metadata = "0.8"
librespot-oauth = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json"] }
futures = "0.3"

env_logger = "0.11"
lofty = "0.21"
ureq = { version = "2", features = ["json"] }
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
librespot-connect = { version = "0.8", default-features = false }

[profile.release]
opt-level = 2
lto = false
incremental = true
